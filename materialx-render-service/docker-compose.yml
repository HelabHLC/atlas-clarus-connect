services:
  materialx-renderer:
    build:
      context: .
      args:
        MATERIALX_VERSION: 1.39.4
    restart: unless-stopped
    environment:
      ATLAS_MASTER_SHA256: 8283ab91b10f89ac758d09ecf5fb4d6343536600a06dd468b1cc1ecf4ec747c4
      RENDERER_BEARER_TOKEN: change-this-before-public-deployment
      MAX_ASSET_BYTES: 10485760
      RENDER_TIMEOUT_SECONDS: 45
    ports:
      - "127.0.0.1:8080:8080"
