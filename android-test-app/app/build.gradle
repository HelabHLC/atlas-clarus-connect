plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlasclarus.browseredition.test'
    compileSdk 36

    defaultConfig {
        applicationId 'com.atlasclarus.browseredition.test.bilingual.navguard'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.3.3-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def prepareBundle = tasks.register('prepareBundle', Exec) {
    workingDir project.rootDir
    commandLine 'python3', 'prepare_bundle.py'
    inputs.files fileTree(new File(rootProject.projectDir, '../browser-bundle/src')),
            fileTree(new File(rootProject.projectDir, '../hover-library/data')),
            fileTree(new File(rootProject.projectDir, '../designer-layer')),
            new File(rootProject.projectDir, '../browser-bundle/build_bundle.py'),
            new File(rootProject.projectDir, 'prepare_bundle.py'),
            new File(rootProject.projectDir, 'android-export.js')
    inputs.files new File(rootProject.projectDir, 'build_colour_id_locale.py'),
            new File(rootProject.projectDir, 'colour-id-en.json'),
            new File(rootProject.projectDir, 'colour-id-dynamic-en.json'),
            new File(rootProject.projectDir, 'colour-id-i18n.js')
    inputs.property 'colourIdSha256', '580d4447193a736ad47a04a876a7437f757b98491836f6a3e8abaa9714769bff'
    outputs.dir file('src/main/assets/bundle')
}
tasks.named('preBuild').configure { dependsOn prepareBundle }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
        .configureEach { dependsOn prepareBundle }
