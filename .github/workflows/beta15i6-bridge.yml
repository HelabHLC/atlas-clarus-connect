name: beta15i.6 integration bridge tests

on:
  push:
    branches:
      - integration/beta15i6-multi-gamut-colour-consultancy
  pull_request:
    paths:
      - 'browser-bundle/src/beta15i6-integration-bridge.js'
      - 'browser-bundle/tests/beta15i6-integration-bridge.test.cjs'
      - '.github/workflows/beta15i6-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bridge syntax
        run: node --check browser-bundle/src/beta15i6-integration-bridge.js
      - name: Validate display capability module syntax
        run: node --check browser-bundle/src/beta15i6-display-capabilities.js
      - name: Run display capability contract tests
        run: node --test browser-bundle/tests/beta15i6-display-capabilities.test.cjs
      - name: Validate colour advice handoff syntax
        run: node --check browser-bundle/src/beta15i6-colour-advice-handoff.js
      - name: Test colour advice handoff contract
        run: node --test browser-bundle/tests/beta15i6-colour-advice-handoff.test.cjs
      - name: Validate ICC adapter syntax
        run: node --check browser-bundle/src/beta15i6-icc-adapter.js
      - name: Test ICC adapter contract (mock only)
        run: node --test browser-bundle/tests/beta15i6-icc-adapter.test.cjs
      - name: Validate wide-gamut worker and adapter syntax
        run: |
          node --check browser-bundle/src/beta15i6-wide-gamut-worker.inc.js
          node --check browser-bundle/src/beta15i6-wide-gamut-icc-adapter.js
      - name: Test unclipped wide-gamut handoff contract
        run: node --test browser-bundle/tests/beta15i6-wide-gamut-icc.test.cjs
      - name: Run isolated bridge contract tests
        run: node --test browser-bundle/tests/beta15i6-integration-bridge.test.cjs
