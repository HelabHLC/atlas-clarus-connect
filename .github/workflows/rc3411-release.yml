name: RC34.11 colour origin release
on:
  push:
    branches: [release/rc34.11-colour-origin-20261101]
permissions:
  contents: write
concurrency:
  group: rc3411-colour-origin-release
  cancel-in-progress: true
jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip
      - name: Download pinned RC34.10 inputs and test dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir inputs
          gh release download v0.2.0-rc34.10-quarkxpress-source-zip --pattern 'ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.10-quarkxpress-source-zip.zip' --pattern 'ATLAS_Clarus_Browser_Edition_v0.1.19-beta1_RC34.10.zip' --dir inputs
          python -m pip install Pillow==12.0.0
          npm install --prefix qa-runtime --ignore-scripts --no-audit --no-fund playwright@1.54.1
          qa-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and verify promoted release and guarded installers
        run: |
          python releases/rc34.11/package.py --base inputs/ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.10-quarkxpress-source-zip.zip --output-dir candidate
          python releases/rc34.11/promote_release.py --candidate candidate/ATLAS_Clarus_RC34_11_Colour_Origin_Preview.zip --base-plugin inputs/ATLAS_Clarus_Browser_Edition_v0.1.19-beta1_RC34.10.zip --output-dir release3411
          python releases/rc34.11/build_small_installer.py --full release3411/ATLAS_Clarus_Browser_Edition_v0.1.20-beta1_RC34.11.zip --output-dir small3411
          php -l release3411/plugin-source/atlas-clarus-browser-edition/atlas-clarus-browser-edition.php
          php -l small3411/plugin-source/atlas-clarus-browser-edition/atlas-clarus-browser-edition.php
          php -d memory_limit=1024M wordpress-browser-edition/tests/validate_plugin.php release3411/plugin-source/atlas-clarus-browser-edition
          php -d memory_limit=1024M small3411/validate_small.php small3411/plugin-source/atlas-clarus-browser-edition small3411/bundle-fixture.zip
      - name: Profile metadata, source identity and export regressions
        env:
          NODE_PATH: ${{ github.workspace }}/qa-runtime/node_modules
          ATLAS_BUNDLE_VERSION: 0.2.0-rc34.11-colour-origin
        run: |
          python -m zipfile -e inputs/ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.10-quarkxpress-source-zip.zip baseline
          python releases/rc34.11/generate-fixtures.py fixtures
          node releases/rc34.11/test-metadata.cjs fixtures release3411/atlas-clarus-browser-bundle
          node releases/rc34.9/verify.cjs release3411/atlas-clarus-browser-bundle
          node releases/rc34.11/browser-acceptance.cjs release3411/atlas-clarus-browser-bundle baseline/atlas-clarus-browser-bundle fixtures evidence/origin
          node releases/rc34.10/browser-acceptance.cjs release3411/atlas-clarus-browser-bundle evidence/source-zip
      - name: Publish verified Browser Edition and IONOS installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-rc34.11-colour-origin --target "$GITHUB_SHA" --title 'ATLAS Clarus RC34.11 — Colour origin / Farbherkunft' --notes-file releases/rc34.11/RELEASE.md --prerelease release3411/ATLAS_Clarus_*.zip release3411/ATLAS_Clarus_*.sha256 small3411/ATLAS_Clarus_*.zip small3411/ATLAS_Clarus_*.sha256 release3411/release-info.json release3411/BUNDLE_MANIFEST.json small3411/small-installer-info.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC34.11-release-evidence
          path: |
            evidence/
            fixtures/metadata-results.json
          retention-days: 30
