name: RC36 BYOS actual browser release gate
on:
  pull_request:
    branches: [integration/rc36]
    paths: ['rc36/**', '.github/workflows/rc36-byos-browser-gate.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native LittleCMS and independent local test profile
        run: sudo apt-get update -qq && sudo apt-get install -y liblcms2-2 ghostscript
      - name: Rebuild exact baseline and isolated staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0-brand-palette-0.1.7 --pattern 'ATLAS_Clarus_Browser_Edition_Test_0.1.7_DE_EN.zip' --dir inputs
          mkdir -p evidence
          python3 rc36/prepare_candidate.py --base inputs/ATLAS_Clarus_Browser_Edition_Test_0.1.7_DE_EN.zip --out baseline
          python3 rc36/prepare_byos_staging.py --candidate baseline --out candidate
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          cmp baseline/assets/atlas-data.js candidate/assets/atlas-data.js
      - name: Run registry and CIEDE2000 unit tests
        run: node --test rc36/test-byos.mjs rc36/test-byos-lab-card.mjs
      - name: Install Chromium
        run: |
          npm ci --prefix browser-bundle/tests --ignore-scripts
          browser-bundle/tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual browser picker, provenance, card, local ICC and native comparison
        run: |
          export ATLAS_TEST_CMYK="$(find /usr/share/color/icc -name default_cmyk.icc -print -quit)"
          test -n "$ATLAS_TEST_CMYK"
          python3 rc36/native-lab-reference.py "$ATLAS_TEST_CMYK" > evidence/native-reference.json
          node rc36/test-browser-byos.cjs
      - name: Retain numeric evidence only (no profiles or runtime)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc36-byos-browser-evidence
          path: evidence/*.json
          if-no-files-found: warn
