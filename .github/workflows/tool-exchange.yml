name: Clarus tool exchange round trips
on:
  push:
    branches: [feat/clarus-tool-exchange-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm ci --prefix browser-bundle/tests --ignore-scripts
          browser-bundle/tests/node_modules/.bin/playwright install --with-deps chromium
          python browser-bundle/build_tool_exchange_preview.py
          EXCHANGE_TEST_OUTPUT=/tmp/atlas-tool-exchange-core node browser-bundle/tests/validate_tool_exchange.cjs
          node browser-bundle/tests/validate_tool_exchange_browser.cjs
          python browser-bundle/tests/verify_tool_exchange_exports.py
          node browser-bundle/tests/validate_reduction_job.cjs
          node browser-bundle/tests/validate_exports.js
          node browser-bundle/tests/validate_source_assignments.js
          node browser-bundle/tests/validate_colour_handoff.js
          node browser-bundle/tests/validate_colour_projects.js
          node browser-bundle/tests/validate_print_handoff.js
          node browser-bundle/tests/validate_colour_reference_card.js
          python -m pip install Pillow numpy
          REDUCTION_HTML=$PWD/browser-bundle/build-tool-exchange/atlas-clarus-browser-bundle/index.html node browser-bundle/tests/validate_colour_reduction_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC34-tool-exchange-preview-and-evidence
          path: |
            browser-bundle/build-tool-exchange/*.zip
            browser-bundle/build-tool-exchange/SHA256SUMS.txt
            /tmp/atlas-tool-exchange-core/*
            /tmp/atlas-tool-exchange-browser/*
          retention-days: 30
