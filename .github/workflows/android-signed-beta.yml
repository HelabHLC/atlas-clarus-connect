name: Android signed beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-beta:
    runs-on: ubuntu-24.04
    environment: android-beta-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check SDK and signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_CONNECT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATLAS_CONNECT_STORE_PASSWORD }}
          KEY_ALIAS: atlas-connect-beta
          KEY_PASSWORD: ${{ secrets.ATLAS_CONNECT_STORE_PASSWORD }}
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/atlas-connect-beta.jks"; then
            echo 'ATLAS_CONNECT_KEYSTORE_BASE64 is not valid Base64. Paste the complete contents of ATLAS-Clarus-Connect-Beta-KEYSTORE_BASE64.txt.'
            exit 1
          fi
          test -s "$RUNNER_TEMP/atlas-connect-beta.jks"
          actual_sha=$(sha256sum "$RUNNER_TEMP/atlas-connect-beta.jks" | cut -d' ' -f1)
          test "$actual_sha" = 'f35b7ba7881103948cb298d8abaaa64b2626b2d89580bb82fdeed2b1349e396e' || {
            echo 'Keystore bytes do not match the reserved beta key'
            exit 1
          }
          if ! keytool -list -keystore "$RUNNER_TEMP/atlas-connect-beta.jks" \
            -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo 'Reserved keystore matches, but the store password is incorrect'
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/atlas-connect-beta.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD >/dev/null 2>&1; then
            echo 'Store password is valid, but the key alias is incorrect'
            exit 1
          fi
          echo "ATLAS_CONNECT_KEYSTORE_PATH=$RUNNER_TEMP/atlas-connect-beta.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ATLAS_CONNECT_STORE_PASSWORD: ${{ secrets.ATLAS_CONNECT_STORE_PASSWORD }}
          ATLAS_CONNECT_KEY_ALIAS: atlas-connect-beta
          ATLAS_CONNECT_KEY_PASSWORD: ${{ secrets.ATLAS_CONNECT_STORE_PASSWORD }}
        run: gradle -p android-test-app :app:assembleRelease --no-daemon
      - name: Verify APK signature and identity
        run: |
          apk=android-test-app/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            grep -Eiq 'certificate SHA-256 digest: 986ca730efc54a20cfc88af4fb61018dfe7658f3165c5b6fb55eb9c59ccad63c'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -E "^package: name='com.atlasclarus.connect' versionCode='3' versionName='0.4.0-beta.3'"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Clarus-Connect-Beta-0.4.0-beta.3
          path: android-test-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-connect-beta.jks"
