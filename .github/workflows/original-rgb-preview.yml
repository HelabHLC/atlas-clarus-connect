name: Exact original RGB preview
on:
  pull_request:
    paths:
      - 'browser-bundle/**'
      - '.github/workflows/original-rgb-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node browser-bundle/tests/validate_colour_reduction.js
          node browser-bundle/tests/validate_original_rgb.js
          python browser-bundle/build_original_rgb_preview.py
          npm ci --prefix browser-bundle/tests --ignore-scripts
          browser-bundle/tests/node_modules/.bin/playwright install --with-deps chromium
          python -m pip install Pillow
          node browser-bundle/tests/validate_original_rgb_browser.cjs
          REDUCTION_HTML=browser-bundle/build-original-preview/atlas-clarus-browser-bundle/index.html node browser-bundle/tests/validate_colour_reduction_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-original-rgb-offline-preview
          path: |
            browser-bundle/build-original-preview/*rc33.3*.zip
            /tmp/atlas-original-rgb/
          retention-days: 14
