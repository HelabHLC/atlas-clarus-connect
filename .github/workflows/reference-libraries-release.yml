name: RC34.4 WordPress reference library release
on:
  push:
    branches: [feat/process-libraries-20261018]
  pull_request:
    paths: ['wordpress-browser-edition/**', 'hover-library/**', 'browser-bundle/manifest-rc34.4.json', '.github/workflows/reference-libraries-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python browser-bundle/build_process_library_preview.py
          python wordpress-browser-edition/build_reference_libraries_release.py
          python wordpress-browser-edition/build_reference_libraries_release.py --output-dir /tmp/atlas-release-repeat
          cmp downloads/rc34.4/ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.4-reference-libraries.zip /tmp/atlas-release-repeat/ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.4-reference-libraries.zip
          cmp downloads/rc34.4/ATLAS_Clarus_Browser_Edition_v0.1.16-beta2_RC34.4.zip /tmp/atlas-release-repeat/ATLAS_Clarus_Browser_Edition_v0.1.16-beta2_RC34.4.zip
          cmp downloads/rc34.4/ATLAS_Clarus_Hover_Library_v0.2.7-beta1.zip /tmp/atlas-release-repeat/ATLAS_Clarus_Hover_Library_v0.2.7-beta1.zip
          python -m zipfile -e downloads/rc34.4/ATLAS_Clarus_Browser_Edition_v0.1.16-beta2_RC34.4.zip /tmp/atlas-wp-reference-release
          php -l /tmp/atlas-wp-reference-release/atlas-clarus-browser-edition/atlas-clarus-browser-edition.php
          php -d memory_limit=512M wordpress-browser-edition/tests/validate_plugin.php /tmp/atlas-wp-reference-release/atlas-clarus-browser-edition
          php hover-library/tests/validate-data.php
          git diff --exit-code -- browser-bundle/manifest-rc34.4.json hover-library/data/colors.json
      - uses: actions/upload-artifact@v4
        with:
          name: RC34.4-WordPress-Browser-Hover-PHP-${{ matrix.php }}
          path: downloads/rc34.4/*
          retention-days: 30
