name: RC36.1 source provenance candidate
on:
  push:
    branches: [integration/rc36]
    paths: ['rc36/**', '.github/workflows/rc36-source.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0-brand-palette-0.1.7 --pattern 'ATLAS_Clarus_Browser_Edition_Test_0.1.7_DE_EN.zip' --dir inputs
      - name: Prepare isolated candidate
        run: |
          mkdir -p evidence
          python3 rc36/prepare_candidate.py --base inputs/ATLAS_Clarus_Browser_Edition_Test_0.1.7_DE_EN.zip --out candidate | tee evidence/build.json
          (cd candidate && sha256sum -c SHA256SUMS.txt --quiet)
      - name: Verify actual candidate palette codecs
        run: |
          node rc36/test-source.mjs candidate | tee evidence/source-tests.txt
      - name: Existing brand palette core regression
        run: node previews/logo-brand-palette/test-core.cjs candidate evidence
      - name: Keep candidate and evidence (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc36-1-candidate
          path: |
            candidate/
            evidence/
          if-no-files-found: warn
