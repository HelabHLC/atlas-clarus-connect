name: ArtCraft ATLAS Windows pilot

on:
  push:
    branches: [feat/artcraft-windows-pilot-20261013]
    paths:
      - integrations/artcraft-windows-pilot/**
      - .github/workflows/artcraft-windows-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artcraft-clarus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-pilot:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      SQLX_OFFLINE: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - name: Preserve pinned file bytes
        run: git config --global core.autocrlf false
      - name: Check out pilot build instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: connect
          persist-credentials: false
      - name: Check out the user's exact ArtCraft release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: storytold/artcraft
          ref: c3844acdadf630db0c17ec1d1512bcf6bbc1b4f9
          path: artcraft
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply pinned integration and profile patches
        run: python connect/integrations/artcraft-windows-pilot/prepare.py artcraft
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: artcraft/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: artcraft -> target
          key: artcraft-041-clarus-windows
          cache-on-failure: true
      - name: Install native build prerequisites
        run: |
          choco install cmake strawberryperl pkgconfiglite llvm nasm --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey failed: $LASTEXITCODE" }
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Strawberry\c\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          exit 0
      - name: Test frontend and build portable Windows executable
        run: |
          ./connect/integrations/artcraft-windows-pilot/build-windows.ps1 -ArtcraftCheckout artcraft -OutputDirectory output
      - name: Check native startup and separate data directory
        run: |
          ./connect/integrations/artcraft-windows-pilot/smoke-windows.ps1 -Executable output/ArtCraft-ATLAS-Pilot/ArtCraft-ATLAS-Pilot.exe -ResultFile output/native-startup.json
      - name: Upload candidate and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArtCraft-ATLAS-Pilot-Windows-x64-${{ github.run_number }}
          path: |
            output/*.zip
            output/*.json
          if-no-files-found: warn
          retention-days: 14
