name: Mischatlas package
on:
  pull_request:
    paths: ['mischatlas/**', '.github/workflows/mischatlas.yml']
  push:
    branches: [main]
    paths: ['mischatlas/**', '.github/workflows/mischatlas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 mischatlas/build.py
      - run: php -l mischatlas/dist/atlas-clarus-mischatlas/atlas-clarus-mischatlas.php
      - run: npm install --prefix /tmp/atlas-smoke playwright@1.56.1
      - run: node /tmp/atlas-smoke/node_modules/playwright/cli.js install --with-deps chromium
      - run: node mischatlas/light-mixing/browser-smoke.cjs
        env:
          ATLAS_PLAYWRIGHT_MODULE: /tmp/atlas-smoke/node_modules/playwright
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-clarus-mischatlas-0.1.4
          path: mischatlas/dist/atlas-clarus-mischatlas-0.1.4.zip
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 mischatlas/build.py
      - name: Prepare public downloads
        run: |
          cp mischatlas/dist/atlas-clarus-mischatlas/assets/mischatlas.html mischatlas/dist/atlas-clarus-mixing-atlas-0.1.4.html
          cd mischatlas/dist
          sha256sum atlas-clarus-mischatlas-0.1.4.zip atlas-clarus-mixing-atlas-0.1.4.html > SHA256SUMS.txt
      - name: Publish requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create atlas-mixing-v0.1.4 \
            mischatlas/dist/atlas-clarus-mischatlas-0.1.4.zip \
            mischatlas/dist/atlas-clarus-mixing-atlas-0.1.4.html \
            mischatlas/dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ATLAS Clarus Mixing Atlas 0.1.4 — 38-light experimental mixing" \
            --notes-file mischatlas/RELEASE_NOTES_0.1.4.md
