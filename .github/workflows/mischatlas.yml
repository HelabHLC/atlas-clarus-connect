name: Mischatlas package
on:
  pull_request:
    paths: ['mischatlas/**', '.github/workflows/mischatlas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 mischatlas/build.py
      - run: php -l mischatlas/dist/atlas-clarus-mischatlas/atlas-clarus-mischatlas.php
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-clarus-mischatlas-0.1.1
          path: mischatlas/dist/atlas-clarus-mischatlas-0.1.1.zip
