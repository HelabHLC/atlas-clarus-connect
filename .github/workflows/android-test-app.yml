name: Android test app

on:
  pull_request:
    paths:
      - 'android-test-app/**'
      - 'browser-bundle/**'
      - 'hover-library/data/**'
      - 'designer-layer/**'
      - '.github/workflows/android-test-app.yml'
      - '.github/workflows/android-signed-beta.yml'
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Android version and bundle pin contract
        run: python3 android-test-app/test_release_identity.py
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate unchanged default browser bundle
        run: python3 browser-bundle/tests/validate_bundle.py
      - name: Check Android export adapter
        run: node android-test-app/test-export-adapter.js
      - name: Build debug APK with pinned RC32.2 reference cards
        run: gradle -p android-test-app :app:assembleDebug --no-daemon
      - name: Check DE/EN identity and scripts
        run: |
          python3 android-test-app/test_locale.py
          node android-test-app/test-locale-runtime.js
          node android-test-app/test-provenance-runtime.js
      - name: Verify packaged bundle and manifest
        run: |
          test -s android-test-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-test-app/app/build/outputs/apk/debug/app-debug.apk |
            grep -F "package: name='com.atlasclarus.connect.dev' versionCode='8' versionName='0.4.0-beta.8-debug'"
          python3 android-test-app/test_packaged_bundle.py android-test-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-test-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Validate Image Projects in Android-prepared HTML
        env:
          IMAGE_PROJECTS_HTML: android-test-app/app/src/main/assets/bundle/index.html
        run: |
          npm ci --prefix browser-bundle/tests --ignore-scripts
          browser-bundle/tests/node_modules/.bin/playwright install --with-deps chromium
          python3 -m pip install Pillow pypdf
          python3 browser-bundle/tests/prepare_source_binding.py /tmp/atlas-source-binding
          node browser-bundle/tests/validate_image_source_binding.cjs
          node browser-bundle/tests/validate_image_projects_browser.cjs
          python3 browser-bundle/tests/validate_image_png.py /tmp/atlas-image-projects-browser/project.zip
      - name: Validate RC32.2 cards and printable companion in Android HTML
        env:
          CARD_HTML: android-test-app/app/src/main/assets/bundle/index.html
        run: |
          node browser-bundle/tests/validate_colour_reference_card.js
          node browser-bundle/tests/validate_colour_reference_card_browser.cjs
      - name: Check out immutable signed beta.7 baseline for upgrade test
        uses: actions/checkout@v4
        with:
          ref: 9e369afc439f3cf22fdac34ef0a302c60f5ccfa6
          path: .beta7-baseline
      - name: Verify stored work survives beta.7 to beta.8 document update
        run: |
          python3 .beta7-baseline/android-test-app/prepare_bundle.py
          node android-test-app/test-card-upgrade.cjs
      - name: Save Android update and card evidence
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Clarus-Android-Beta8-card-and-update-evidence
          path: |
            /tmp/atlas-android-upgrade/
            /tmp/atlas-colour-reference-card/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Clarus-Android-Beta8-DEBUG-NOT-AN-UPDATE
          path: android-test-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Verify APK and AAB signing paths with disposable CI key
        env:
          ATLAS_CONNECT_KEYSTORE_PATH: ${{ runner.temp }}/atlas-connect-ci.jks
          ATLAS_CONNECT_STORE_PASSWORD: disposable-ci-only
          ATLAS_CONNECT_KEY_ALIAS: ci-only
          ATLAS_CONNECT_KEY_PASSWORD: disposable-ci-only
        run: |
          apk=android-test-app/app/build/outputs/apk/release/app-release.apk
          aab=android-test-app/app/build/outputs/bundle/release/app-release.aab
          trap 'rm -f "$ATLAS_CONNECT_KEYSTORE_PATH" "$apk" "$aab"' EXIT
          keytool -genkeypair -keystore "$ATLAS_CONNECT_KEYSTORE_PATH" \
            -storetype PKCS12 -alias "$ATLAS_CONNECT_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname 'CN=CI test only' \
            -storepass "$ATLAS_CONNECT_STORE_PASSWORD" \
            -keypass "$ATLAS_CONNECT_KEY_PASSWORD" -noprompt
          gradle -p android-test-app :app:assembleRelease :app:bundleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.atlasclarus.connect' versionCode='8' versionName='0.4.0-beta.8'"
          test -s "$aab"
          jarsigner -verify "$aab"
          python3 android-test-app/test_packaged_bundle.py "$apk" "$aab"
