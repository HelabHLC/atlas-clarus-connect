name: ATLAS ISCC-NBS name pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/atlas-name-layer-pilot.yml"
      - "tools/name-layer-pilot/**"

permissions:
  contents: read

jobs:
  five-reference-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true
      - name: Install pinned dependencies
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_version("munsellinterpol", version="3.6-0",
                                   repos="https://cloud.r-project.org",
                                   upgrade="never")
          install.packages(c("jsonlite","digest"), repos="https://cloud.r-project.org")
      - name: Calculate five experimental candidates
        run: Rscript tools/name-layer-pilot/run_pilot.R
      - name: Upload non-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS_Name_Layer_Pilot_NOT_RELEASED
          path: name-layer-pilot-results/
          if-no-files-found: error
          retention-days: 30
