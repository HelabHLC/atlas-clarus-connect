name: RC20 one-shot layout distribution regeneration

on:
  push:
    branches:
      - fix/rc20-core-journey

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc20-core-journey
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild and verify RC20 layout repair
        run: |
          python browser-bundle/build_bundle.py
          node browser-bundle/tests/validate_layout.js
          node browser-bundle/tests/validate_basis23_preview.js
          python browser-bundle/tests/validate_bundle.py
      - name: Commit exact distribution and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-bundle/dist
          git rm .github/workflows/rc20-layout-regenerate-once.yml
          git commit -m "Regenerate RC20 layout-repaired distribution"
          git push origin HEAD:fix/rc20-core-journey
