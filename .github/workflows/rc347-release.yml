name: RC34.7 FOGRA58 public beta release
on:
  push:
    branches: [release/rc34.7-ionos-20261026]
    paths: ['browser-bundle/**', 'releases/rc34.7/**', '.github/workflows/rc347-release.yml']
permissions:
  contents: write
concurrency:
  group: rc347-owner-authorized-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip
      - name: Prepare test dependencies and pinned profile
        run: |
          npm ci --prefix browser-bundle/tests --ignore-scripts
          browser-bundle/tests/node_modules/.bin/playwright install --with-deps chromium
          python -m pip install Pillow pypdf
          sudo apt-get install -y liblcms2-2 poppler-utils
          curl --fail --location --retry 3 'https://fogra.org/fileadmin/files/1_forschen/Digitaldruck/13.006_Textile-RGB/TextileRGB_FOGRA58.icc' --output /tmp/TextileRGB_FOGRA58.icc
          echo 'fad691cc0f25e3d6a91942599755b7f9cf906b91f9e4f4834c3364e6c50a972d  /tmp/TextileRGB_FOGRA58.icc' | sha256sum --check
          echo 'TEXTILE_PROFILE=/tmp/TextileRGB_FOGRA58.icc' >> "$GITHUB_ENV"
      - name: Build the exact candidate and run real ICC tests
        run: |
          python browser-bundle/build_textile_conversion.py --output-dir browser-bundle/build-textile-conversion
          node browser-bundle/tests/validate_textile_conversion.cjs
          node browser-bundle/tests/validate_textile_handoff.cjs
          TEXTILE_BUNDLE_DIR=browser-bundle/build-textile-conversion/atlas-clarus-browser-bundle node browser-bundle/tests/validate_textile_bundle.cjs
          node browser-bundle/tests/validate_print_handoff.js
          node browser-bundle/tests/validate_profiled_reference_card.js
      - name: Package and exercise the guarded WordPress installer
        run: |
          python releases/rc34.7/package.py --candidate browser-bundle/build-textile-conversion/ATLAS_Clarus_Browser_Bundle_v0.2.0-rc34.7-textile-conversion-preview.zip --output-dir release347
          python releases/rc34.7/verify.py release347
          php -l release347/plugin-source/atlas-clarus-browser-edition/atlas-clarus-browser-edition.php
          php -d memory_limit=1024M wordpress-browser-edition/tests/validate_plugin.php release347/plugin-source/atlas-clarus-browser-edition
      - name: Native Chromium acceptance and evidence
        run: |
          python -c "from PIL import Image; im=Image.new('RGB',(32,32)); im.putdata([(x*8,y*8,(x+y)*4) for y in range(32) for x in range(32)]); im.save('release347/test.png')"
          node releases/rc34.7/browser-acceptance.cjs
      - name: Publish immutable owner-authorized public beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v0.2.0-rc34.7-textile-conversion'
          gh release create "$tag" --target "$GITHUB_SHA" --title 'ATLAS Clarus RC34.7 — FOGRA58 Textile RGB public beta' --notes-file releases/rc34.7/README.md --prerelease release347/ATLAS_Clarus_*.zip release347/ATLAS_Clarus_*.sha256 release347/release-info.json release347/BUNDLE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC34.7-browser-acceptance
          path: release347/evidence/
          retention-days: 30
