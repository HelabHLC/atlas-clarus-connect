name: Validate ATLAS Clarus Connect

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trycolors-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      - name: Validate Golden-59 measured paint contract
        run: |
          php -l trycolors-bridge/atlas-clarus-trycolors-bridge.php
          python trycolors-bridge/tests/validate_golden59_bridge.py

  tone-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild Tone System and shared Name Search Index
        run: |
          python tools/validate_tone_system.py
          cp designer-layer/ATLAS_Clarus_Tone_System_v0_1.json "$RUNNER_TEMP/tone-system.json"
          cp name-search/atlas-name-search-index-v1.json.gz "$RUNNER_TEMP/name-index.json.gz"
          python tools/apply_tone_system.py
          python tools/build_name_search_index.py
          cmp designer-layer/ATLAS_Clarus_Tone_System_v0_1.json "$RUNNER_TEMP/tone-system.json"
          cmp name-search/atlas-name-search-index-v1.json.gz "$RUNNER_TEMP/name-index.json.gz"
      - name: Validate naming and identity boundaries
        run: python tools/validate_tone_system.py

  checked-in-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate checked-in release and research archives
        shell: bash
        run: |
          set -euo pipefail
          for root in browser-bundle/downloads downloads; do
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' archive; do
              unzip -tq "$archive"
            done < <(find "$root" -type f -name '*.zip' -print0)
          done
          while IFS= read -r -d '' archive; do
            gzip -t "$archive"
          done < <(find research/chsos-rebuild-v0.1 -type f -name '*.json.gz' -print0)

  hover-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      - name: PHP syntax
        run: php -l hover-library/atlas-clarus-hover-library.php
      - name: Validate Hover Library data
        run: php hover-library/tests/validate-data.php

  browser-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: |
          node --check browser-bundle/src/app.js
          node --check browser-bundle/src/image-sampling.js
          node --check browser-bundle/src/pkl-image-binding.js
          node --check browser-bundle/src/palette-export.js
          node --check browser-bundle/src/print-handoff.js
          node --check browser-bundle/src/print-ui.js
          node --check browser-bundle/src/print-preview-ui.js
          node --check browser-bundle/src/print-preview-worker.js
          node --check browser-bundle/src/reference-card.js
          node --check browser-bundle/src/profiled-reference-card.js
          node --check browser-bundle/src/trycolors-recipe.js
          node --check browser-bundle/src/atlas-offline-mixer.js
      - name: Validate reference card handoff and rejection vectors
        run: node browser-bundle/tests/validate_reference_card.js
      - name: Validate profile-bound reference card contract
        run: node browser-bundle/tests/validate_profiled_reference_card.js
      - name: Validate parallel print handoff and rejection vectors
        run: node browser-bundle/tests/validate_print_handoff.js
      - name: Validate numerical image sampling
        run: node browser-bundle/tests/validate_sampling.js
      - name: Validate PKL-first image binding
        run: node browser-bundle/tests/validate_pkl_image_binding.js
      - name: Validate palette exports
        run: node browser-bundle/tests/validate_exports.js
      - name: Validate palette persistence failures and limits
        run: node browser-bundle/tests/validate_palette_workspace.js
      - name: Validate offline CHSOS mixer model and status
        run: node browser-bundle/tests/validate_offline_mixer.js
      - name: Validate Basis-23 before-after previews
        run: node browser-bundle/tests/validate_basis23_preview.js
      - name: Validate responsive layout safeguards
        run: node browser-bundle/tests/validate_layout.js
      - name: Build and validate reproducible bundle
        run: python browser-bundle/tests/validate_bundle.py
      - name: Build reviewable offline candidate
        run: python browser-bundle/build_bundle.py
      - name: Install DOM test dependencies
        run: npm ci --prefix browser-bundle/tests --ignore-scripts
      - name: Validate named-selection mixer panel
        run: node browser-bundle/tests/validate_offline_mixer_ui.js
      - name: Validate shipped print preparation UI
        run: node browser-bundle/tests/validate_print_ui.js
      - name: Validate native and WASM image preview vectors
        run: node browser-bundle/tests/validate_preview.js
      - name: Validate independent B/A image interactions
        run: node browser-bundle/tests/validate_preview_ui.js
      - name: Upload offline candidate
        uses: actions/upload-artifact@v7
        with:
          name: atlas-clarus-parallel-print-candidate
          path: browser-bundle/build/*.zip
          retention-days: 14

  identity-handoff-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python identity-handoff/tests/validate_vectors.py

  wordpress-browser-edition:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
      - name: PHP syntax
        run: |
          php -l wordpress-browser-edition/atlas-clarus-browser-edition.php
          php -l wordpress-browser-edition/tests/validate_plugin.php
      - name: Build installable IONOS plugin
        run: python wordpress-browser-edition/build_plugin.py
      - name: Verify documented RC26 package identity
        run: |
          package=wordpress-browser-edition/build/ATLAS_Clarus_Browser_Edition_v0.1.15-beta6_RC26.zip
          actual_size="$(wc -c < "$package")"
          actual_sha="$(sha256sum "$package" | cut -d " " -f 1)"
          echo "Package identity: size=${actual_size} sha256=${actual_sha}"
          test "$actual_size" -eq 3815838
          echo "882a6319fe9bc7abce5b95887b3412831a5656aeb985c5c222f0d1d9597cb5c3  $package" | sha256sum -c -
      - name: Reproduce installable package
        run: |
          python wordpress-browser-edition/build_plugin.py --output-dir "$RUNNER_TEMP/atlas-plugin-repeat"
          cmp wordpress-browser-edition/build/ATLAS_Clarus_Browser_Edition_v0.1.15-beta6_RC26.zip "$RUNNER_TEMP/atlas-plugin-repeat/ATLAS_Clarus_Browser_Edition_v0.1.15-beta6_RC26.zip"
      - name: Execute plugin install and rollback tests
        run: |
          unzip -q wordpress-browser-edition/build/ATLAS_Clarus_Browser_Edition_v0.1.15-beta6_RC26.zip -d "$RUNNER_TEMP/atlas-plugin-test"
          php wordpress-browser-edition/tests/validate_plugin.php "$RUNNER_TEMP/atlas-plugin-test/atlas-clarus-browser-edition"
      - name: Upload installable IONOS candidate
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-clarus-ionos-rc26-plugin
          path: wordpress-browser-edition/build/*
          retention-days: 14

  wheel-application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: colour-identity-wheel/application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: colour-identity-wheel/application/package-lock.json
      - run: npm ci
      - run: npm test
